---
- name: Montar backends a partir do grupo de inventário
  when: haproxy_backend_servers | default([]) | length == 0
  ansible.builtin.set_fact:
    haproxy_backend_servers: "{{ haproxy_backend_servers | default([]) + [{
        'name': item,
        'address': hostvars[item]['ansible_host'] | default(item),
        'port': haproxy_backend_port | default(80)
      }] }}"
  loop: "{{ groups[haproxy_backend_group] | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Validar a lista de servidores de destino
  ansible.builtin.assert:
    that:
      - haproxy_backend_servers | length > 0
    fail_msg: >-
      Nenhum backend encontrado. Defina haproxy_backend_servers ou
      garanta que o grupo '{{ haproxy_backend_group }}' exista no inventário
      com pelo menos um host (e ansible_host).

- name: Instalar HAProxy
  ansible.builtin.package:
    name: "{{ haproxy_package }}"
    state: present

- name: Garantir que o diretório de configuração exista
  ansible.builtin.file:
    path: /etc/haproxy
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configurar HAProxy com validação antes de substituir o arquivo
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/haproxy -c -f %s
  notify: Reiniciar HAProxy

- name: Garantir que HAProxy esteja iniciado e habilitado
  ansible.builtin.service:
    name: "{{ haproxy_service }}"
    state: started
    enabled: true

- name: Coletar estado do firewalld
  ansible.builtin.service_facts:
  when:
    - haproxy_firewall_configure | bool
    - ansible_facts['os_family'] == 'RedHat'

- name: Liberar porta do HAProxy quando o firewalld estiver ativo
  ansible.posix.firewalld:
    port: "{{ haproxy_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when:
    - haproxy_firewall_configure | bool
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts.get('services', {}).get('firewalld.service', {}).get('state', '') == 'running'
